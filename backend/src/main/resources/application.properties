# ============================================================================
# J18 | Grants Management System (Government & Public Sector)
# Spring Boot Application Properties
# ============================================================================

server.port=8080
server.servlet.context-path=/

# ----------------------------------------------------------------------------
# Primary Datasource: H2 in Oracle Compatibility Mode (Instant Zero-Config Demo)
# ----------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:grantsdb;MODE=Oracle;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ----------------------------------------------------------------------------
# JPA / Hibernate Configuration
# ----------------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

